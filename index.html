<!DOCTYPE html>
<html lang="fr">
<head>

    <script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nooteo - Voyages & Découvertes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background: url("https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=2400&q=80")
    center/cover no-repeat fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #0f172a;
    padding: 20px;
}

.container {
    text-align: center;
    padding: 40px;
    max-width: 700px;
    width: 100%;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 28px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    position: relative;
}

.logo-img {
    max-width: 280px;
    width: 100%;
    height: auto;
    margin-bottom: 25px;
    border-radius: 14px;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
    font-weight: 700;
    color: #0f172a;
}

p {
    font-size: 16px;
    margin-bottom: 35px;
    line-height: 1.6;
    color: #334155;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.box {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    padding: 18px;
    border-radius: 16px;
    min-width: 95px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
}

.number {
    font-size: 36px;
    font-weight: bold;
    color: #0f172a;
}

.label {
    margin-top: 8px;
    font-size: 13px;
    text-transform: uppercase;
    color: #475569;
    letter-spacing: 1px;
    font-weight: 600;
}

.music-control {
    margin-top: 25px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.7);
    padding: 8px 16px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
}

.music-control:hover {
    background: rgba(255, 255, 255, 0.9);
}

.music-control span {
    font-size: 14px;
    font-weight: 600;
    color: #334155;
}

.footer {
    margin-top: 25px;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    color: #334155;
}

.footer a {
    color: #0284c7;
    text-decoration: none;
    font-weight: 600;
}

.footer a:hover {
    text-decoration: underline;
}

@media(max-width:600px){
    .container {
        padding: 20px;
    }
    h1 {
        font-size: 24px;
    }
    .logo-img {
        max-width: 200px;
    }
    .box {
        min-width: 70px;
        padding: 12px;
    }
    .number {
        font-size: 26px;
    }
    .label {
        font-size: 11px;
    }
}
</style>
</head>

<body>
    

<div class="container">

    <!-- Logo chargé depuis le dossier asset -->
    <img src="assets/img.png" alt="Nooteo Logo" class="logo-img">

    <h1>
        Le monde découvrira bientôt Madagascar autrement
    </h1>

    <p>
        Nooteo arrive pour connecter voyageurs,
        hôtels et expériences uniques à Madagascar.
    </p>

    <div class="countdown">
        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">Jours</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">Heures</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">Minutes</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">Secondes</div>
        </div>
    </div>

    <!-- Lecteur audio / Chanson en lecture automatique et en boucle -->
    <audio id="background-audio" loop autoplay>
        <source src="assets/chanson.mp4" type="audio/mp4">
        Votre navigateur ne supporte pas l'élément audio.
    </audio>

    <div class="music-control" id="toggle-music" onclick="togglePlayMusic()">
        <span id="music-icon">⏸️</span>
        <span id="music-text">Pause</span>
    </div>

    <div class="footer">
        <div>Contact : <a href="mailto:nooteo.team@nooteo.com">nooteo.team@nooteo.com</a></div>
        <div>© 2026 Nooteo - Madagascar. Tous droits réservés.</div>
    </div>

</div>

<script>
// Référence fixe alignée sur l'horloge universelle (UTC)
const launchTime = new Date('2026-08-15T00:00:00Z').getTime();

function updateCountdown(){
    const now = new Date().getTime();
    const distance = launchTime - now;

    if(distance <= 0){
        document.querySelector(".countdown").innerHTML =
        "<h2>Nous sommes lancés 🚀</h2>";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerHTML = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerHTML = String(seconds).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);

// Gestion du lecteur de musique avec tentative d'autoplay direct
const audio = document.getElementById('background-audio');
const musicText = document.getElementById('music-text');
const musicIcon = document.getElementById('music-icon');
let isPlaying = true;

window.addEventListener('DOMContentLoaded', () => {
    audio.play().then(() => {
        musicText.textContent = "Pause";
        musicIcon.textContent = "⏸️";
        isPlaying = true;
    }).catch(error => {
        // Certains navigateurs bloquent l'autoplay sans interaction préalable de l'utilisateur
        musicText.textContent = "Écouter la musique";
        musicIcon.textContent = "🎵";
        isPlaying = false;
        console.log("Autoplay bloqué par le navigateur : interaction requise.", error);
    });
});

function togglePlayMusic() {
    if (isPlaying) {
        audio.pause();
        musicText.textContent = "Écouter la musique";
        musicIcon.textContent = "🎵";
        isPlaying = false;
    } else {
        audio.play().then(() => {
            musicText.textContent = "Pause";
            musicIcon.textContent = "⏸️";
            isPlaying = true;
        }).catch(error => {
            console.log("Erreur lors de la lecture audio", error);
        });
    }
}
</script>

</body>
</html>
